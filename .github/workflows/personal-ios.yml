name: Personal iPhone build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'

    steps:
      - name: Check out personal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.7 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/personal-flutter"
          echo "$RUNNER_TEMP/personal-flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter precache --ios
          flutter pub get
          pod install --project-directory=ios

      - name: Build iPhone app without signing
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --flavor=prod

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"
          test -f "$app_path/Info.plist"
          package_root="$RUNNER_TEMP/personal-ios-package"
          mkdir -p "$package_root/Payload" "$GITHUB_WORKSPACE/build/personal-ios"
          ditto "$app_path" "$package_root/Payload/Runner.app"
          cd "$package_root"
          /usr/bin/zip --symlinks -qr \
            "$GITHUB_WORKSPACE/build/personal-ios/Echo-Loop-DeepSeek-unsigned.ipa" Payload
          printf '%s\n' \
            '## Personal iPhone build' \
            'The artifact is unsigned. Sign it with your own Apple account before installing.' \
            'DeepSeek API keys are entered inside the app after installation.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Save IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Echo-Loop-DeepSeek-unsigned-iPhone
          path: build/personal-ios/Echo-Loop-DeepSeek-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
